name: stockflow
services:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the Compose network the database host is the service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockflow}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-stockflow}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (see .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      TAX_RATE_BPS: ${TAX_RATE_BPS:-1100}
      NODE_ENV: production
    ports:
      - "3000:3000"
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-local_test_only}
      POSTGRES_DB: stockflow_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
